  <defs>
    <linearGradient id="bak" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2C74EE"/><stop offset="100%" stop-color="#1446AE"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bak)"/>
  <path d="M92 396 L226 116 L360 396" fill="none" stroke="#FFFFFF" stroke-width="50" stroke-linecap="round" stroke-linejoin="round"/>
