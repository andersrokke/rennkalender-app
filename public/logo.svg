<!-- Alpinrace-merket: en hvit fjelltopp der et carvet spor er skåret ut ned
     gjennom fjellet, så bakgrunnen skinner gjennom. Formen leses som både
     fjell og A. Den røde prikken er porten - det eneste røde i merket. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bak" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2F7BF5"/><stop offset="1" stop-color="#1240A8"/>
    </linearGradient>
    <mask id="spor"><rect width="512" height="512" fill="#fff"/>
      <path d="M250 96 C 196 190, 338 236, 262 318 C 214 370, 262 404, 316 452" fill="none" stroke="#000" stroke-width="40" stroke-linecap="round"/></mask>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bak)"/>
  <path d="M256 92 L436 404 Q444 420 426 420 L86 420 Q68 420 76 404 Z" fill="#FFFFFF" mask="url(#spor)"/>
  <circle cx="352" cy="170" r="22" fill="#FF4D5E"/>
</svg>
