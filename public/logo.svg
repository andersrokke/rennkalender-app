<!-- Rennkalender-merket: en storslalåmport med duk, plantet i snøen.
     Porten er valgt framfor et carvet spor fordi sporet blir en ubestemmelig
     krøll under 64 px, mens porten beholder formen helt ned til 40 - og det
     er der merket faktisk brukes, i en fane eller på en samtykkeskjerm.
     Fargene er blått, hvitt og rødt, de samme som appen ellers. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bak" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B2244"/><stop offset="100%" stop-color="#061223"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bak)"/>
  <g transform="rotate(-9 256 256)">
    <rect x="148" y="94" width="26" height="292" rx="13" fill="#E32347"/>
    <rect x="338" y="94" width="26" height="292" rx="13" fill="#2F6FE0"/>
    <path d="M174 118 H338 V216 H174 Z" fill="#FFFFFF"/>
  </g>
  <path d="M72 410 C 168 372, 220 438, 300 404 C 366 376, 398 404, 442 394"
        fill="none" stroke="#FFFFFF" stroke-width="28" stroke-linecap="round" opacity=".9"/>
</svg>
