<!-- Alpinrace-merket: en A som er en fjelltopp, med et carvet spor som
     tverrstrek og en rød port ved foten. Blått og hvitt er vinter og snø;
     det røde er porten, og det eneste røde i merket.
     Formen er tegnet med tykke, runde streker så den holder helt ned til
     32 px i en nettleserfane. -->
